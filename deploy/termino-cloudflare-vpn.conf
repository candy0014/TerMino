# Install as ~/.config/systemd/user/termino-cloudflare.service.d/route.conf
# for a host with a working system VPN. Remove this drop-in to use the
# physical-uplink fallback from the base service again.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 %h/termino-cloudflare/run_cloudflare_direct.py --route system
