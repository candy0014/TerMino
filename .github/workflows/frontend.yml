name: Frontend foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: frontend-headless-linux
          - os: windows-2022
            preset: frontend-headless-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Preserve terminal identifiers
        run: python -m unittest discover -s tests -p frontend_baseline_test.py -v
      - name: Configure without frontend or network dependencies
        run: cmake --preset ${{ matrix.preset }}
      - name: Build core and presentation tests
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Check core and frontend contracts
        run: ctest --preset ${{ matrix.preset }}
