name: Validate and package frontend candidates

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and package
        required: true
        type: string
      publish:
        description: Explicitly publish after native acceptance (default is packaging only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install integration test dependency
        run: python -m pip install --require-hashes -r deploy/websocket-requirements.txt
      - name: Audit public source
        run: python tools/check_public_source.py
      - name: Python and pressure regressions
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tests -p '*test.py' -v
          node tests/moch_pressure_test.cjs
      - name: Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev xvfb
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTETR_PORTABLE_BUILD=ON -DTETR_PORTABLE_RESET_SETTINGS=ON -DTETR_BUILD_OPENGL=ON -DTETR_PORTABLE_FULL_STATIC=OFF -DTETR_GRAPHICS_BUNDLED_DEPS=ON
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\Program Files\Git\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          cmake -S . -B build-release -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTETR_PORTABLE_BUILD=ON -DTETR_PORTABLE_RESET_SETTINGS=ON -DTETR_BUILD_OPENGL=ON -DTETR_PORTABLE_FULL_STATIC=OFF -DTETR_GRAPHICS_BUNDLED_DEPS=ON
      - name: Build all targets
        run: cmake --build build-release --config Release --parallel 2
      - name: Full native CTest suite
        run: ctest --test-dir build-release -C Release --output-on-failure --parallel 2 --output-junit test-results.xml
      - name: Package terminal, graphics and server together
        run: python tools/package_frontends.py --build-dir build-release --frontend bundle --no-build --output-dir dist
      - name: Linux hidden packaged client checks
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
        run: xvfb-run -a python tools/check_frontend_distribution.py dist --report build-release/package-tests.json
      - name: Windows packaged CLI checks
        if: runner.os == 'Windows'
        run: python tools/check_frontend_distribution.py dist --skip-graphics --report build-release/package-tests.json
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ runner.os }}
          path: |
            build-release/test-results.xml
            build-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify both platform bundles use the selected source
        run: python tools/check_frontend_distribution.py release-assets --matrix --structure-only
      - name: Require completed native acceptance
        run: python tools/check_frontend_acceptance.py docs/acceptance/native.json --commit $(git rev-parse HEAD)
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || exit 2
          git show-ref --verify "refs/tags/$TAG"
          (cd release-assets && sha256sum --check *.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --latest --notes-file docs/releases/latest.txt
          else
            gh release create "$TAG" release-assets/* --verify-tag --latest \
              --title "TerMino $TAG" --notes-file docs/releases/latest.txt
          fi
