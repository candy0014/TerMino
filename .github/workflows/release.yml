name: Validate, package and publish frontend previews

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and package
        required: true
        type: string
      publish:
        description: Explicitly publish after native acceptance (default is packaging only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install integration test dependency
        run: python -m pip install --require-hashes -r deploy/websocket-requirements.txt
      - name: Audit public source
        run: python tools/check_public_source.py
      - name: Python and pressure regressions
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tests -p '*test.py' -v
          node tests/moch_pressure_test.cjs
      - name: Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev xvfb
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTETR_PORTABLE_BUILD=ON -DTETR_PORTABLE_RESET_SETTINGS=ON -DTETR_BUILD_OPENGL=ON -DTETR_PORTABLE_FULL_STATIC=OFF -DTETR_GRAPHICS_BUNDLED_DEPS=ON
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\Program Files\Git\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          cmake -S . -B build-release -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTETR_PORTABLE_BUILD=ON -DTETR_PORTABLE_RESET_SETTINGS=ON -DTETR_BUILD_OPENGL=ON -DTETR_PORTABLE_FULL_STATIC=OFF -DTETR_GRAPHICS_BUNDLED_DEPS=ON
      - name: Build all targets
        run: cmake --build build-release --config Release --parallel 2
      - name: Full native CTest suite
        run: ctest --test-dir build-release -C Release --output-on-failure --parallel 2 --output-junit test-results.xml
      - name: Package terminal, graphics and server together
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('ci-{0}', github.sha) }}
        run: python tools/package_frontends.py --build-dir build-release --frontend bundle --no-build --output-dir dist --version "$PACKAGE_VERSION"
      - name: Linux hidden packaged client checks
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
        run: xvfb-run -a python tools/check_frontend_distribution.py dist --report build-release/package-tests.json
      - name: Windows packaged CLI checks
        if: runner.os == 'Windows'
        run: python tools/check_frontend_distribution.py dist --skip-graphics --report build-release/package-tests.json
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ runner.os }}
          path: |
            build-release/test-results.xml
            build-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  android:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Audit public source
        run: python tools/check_public_source.py
      - name: Build and audit universal Android preview
        run: python tools/build_android.py --jobs 2 --output "dist/TerMino-Android-${{ github.ref_name }}.apk"
      - name: Upload Android preview assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-Android
          path: |
            dist/*.apk
            dist/*.sha256
            dist/*.audit.json
          if-no-files-found: error
          retention-days: 7

  publish-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.')
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify clean desktop bundles match the tagged source
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_frontend_distribution.py release-assets --matrix --structure-only
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          # The distribution audit above checks the archive provenance and all files.
          # Confirm the same source was selected for both platform builds.
          import tarfile
          import zipfile
          for archive in Path('release-assets').iterdir():
              if archive.name.endswith('.tar.gz'):
                  with tarfile.open(archive) as package:
                      name = next(n for n in package.getnames() if n.endswith('/BUILD.json'))
                      info = json.load(package.extractfile(name))
              elif archive.suffix == '.zip':
                  with zipfile.ZipFile(archive) as package:
                      name = next(n for n in package.namelist() if n.endswith('/BUILD.json'))
                      info = json.loads(package.read(name))
              else:
                  continue
              assert info['source_commit'] == commit and not info['source_dirty'], archive
          PY
          (cd release-assets && sha256sum --check *.sha256)
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9._-]*-preview\.[0-9]+$ ]] || exit 2
          git show-ref --verify "refs/tags/$TAG"
          notes="docs/releases/$TAG.txt"
          test -f "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --prerelease --latest=false --notes-file "$notes"
          else
            gh release create "$TAG" release-assets/* --verify-tag --prerelease --latest=false \
              --title "TerMino $TAG" --notes-file "$notes"
          fi

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify both platform bundles use the selected source
        run: python tools/check_frontend_distribution.py release-assets --matrix --structure-only
      - name: Require completed native acceptance
        run: python tools/check_frontend_acceptance.py docs/acceptance/native.json --commit $(git rev-parse HEAD)
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || exit 2
          git show-ref --verify "refs/tags/$TAG"
          (cd release-assets && sha256sum --check *.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --latest --notes-file docs/releases/latest.txt
          else
            gh release create "$TAG" release-assets/* --verify-tag --latest \
              --title "TerMino $TAG" --notes-file docs/releases/latest.txt
          fi
